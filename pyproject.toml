[project]
name = "chat-agent"
version = "0.1.0"
description = "Terminal-based chat agent using Google Agent Development Kit"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.18,<2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
